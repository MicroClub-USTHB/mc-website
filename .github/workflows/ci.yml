name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          # Placeholders: the build imports the auth config, which needs them but connects to nothing.
          MONGODB_URI: mongodb://localhost:27017/microclub
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-to-sign-anything
          BETTER_AUTH_URL: http://localhost:3000
